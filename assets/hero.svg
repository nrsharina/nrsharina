<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Please hire me. Looking for a team to commit to.</title>
<desc id="desc">Sharina, based in Malaysia, is actively job hunting. A playful purple and mint terminal banner about web applications, solar technology and geospatial tools. The terminal says git commit -m "hire Sharina", and a sticky note reads: Plot twist: you're hiring?</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191324"/><stop offset="1" stop-color="#2b203c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#bb9feb" stop-opacity=".17"/><stop offset="1" stop-color="#bb9feb" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c4b4e5" opacity=".12"/></pattern>
  <clipPath id="outer"><rect x="1" y="1" width="1198" height="558" rx="26"/></clipPath>
</defs>
<style>
@keyframes cursor {0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
.cursor{animation:cursor 1.6s steps(1) infinite}
.note{animation:float 5s ease-in-out infinite}
.live{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#outer)">
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect y="84" width="1200" height="476" fill="url(#dots)"/>
  <ellipse cx="880" cy="305" rx="400" ry="280" fill="url(#glow)"/>
  <rect width="1200" height="84" fill="#120f1b" opacity=".62"/>
  <path d="M0 84H1200" stroke="#a68cc8" stroke-opacity=".24"/>
</g>
<rect x="1" y="1" width="1198" height="558" rx="26" fill="none" stroke="#7b658e" stroke-opacity=".45"/>

<!-- Identity and availability, styled as a window title bar. -->
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="40" y="23" width="39" height="38" rx="10" fill="#b8ffd9"/>
  <text x="48" y="50" font-size="24" font-weight="700" fill="#191324">s/</text>
  <text x="96" y="48" font-size="19" font-family="Menlo,Consolas,monospace" fill="#e8ddf6">~/nrsharina</text>
  <text x="253" y="47" font-size="17" fill="#9f90b5">/ a very public job application</text>
  <rect x="921" y="22" width="238" height="40" rx="20" fill="#b8ffd9" fill-opacity=".09" stroke="#b8ffd9" stroke-opacity=".38"/>
  <circle cx="944" cy="42" r="5" fill="#b8ffd9" class="live"/>
  <text x="960" y="48" font-size="17" font-weight="700" letter-spacing="1.5" fill="#b8ffd9">OPEN TO WORK</text>

  <text x="52" y="138" font-size="15" letter-spacing="2.4" fill="#baabd0">HI, I'M SHARINA. AND YES, THIS IS ME ASKING.</text>
  <text x="47" y="244" font-size="112" font-weight="800" letter-spacing="-6" fill="#fff6ec">Please</text>
  <text x="47" y="349" font-size="112" font-weight="800" letter-spacing="-6" fill="#b8ffd9">hire me.</text>
  <path d="M57 365C176 355 326 356 443 363" stroke="#c6a6f4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="52" y="410" font-size="26" fill="#f1e7ff">Looking for a team to <tspan font-weight="700" fill="#b8ffd9">commit</tspan> to.</text>
  <text x="52" y="446" font-size="18" fill="#bdb0cc">Web apps · Solar tech · Geospatial tools</text>
</g>

<!-- An intentionally fictional terminal: the command is the hiring joke. -->
<g transform="rotate(2 925 285)">
  <rect x="723" y="144" width="421" height="285" rx="15" fill="#0d0915" opacity=".5"/>
  <rect x="711" y="131" width="421" height="285" rx="15" fill="#100e19" stroke="#ae8ccd" stroke-width="1.5"/>
  <path d="M712 174H1131" stroke="#604d74"/>
  <g>
    <circle cx="733" cy="153" r="5" fill="#f4a0b5"/>
    <circle cx="751" cy="153" r="5" fill="#f2d38f"/>
    <circle cx="769" cy="153" r="5" fill="#b8ffd9"/>
  </g>
  <text x="1094" y="158" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="13" fill="#bdb0cc">job-hunt.sh</text>
  <g font-family="Menlo,Consolas,monospace" font-size="17">
    <text x="737" y="209" fill="#b8ffd9">$ whoami</text>
    <text x="737" y="235" fill="#f5edf9">Sharina / Malaysia</text>
    <text x="737" y="276" fill="#b8ffd9">$ git status</text>
    <text x="737" y="302" fill="#cec0e0">On branch: next-chapter</text>
    <text x="737" y="343" fill="#b8ffd9">$ git commit -m <tspan fill="#f2d38f">"hire Sharina"</tspan></text>
    <text x="737" y="382" fill="#a697bb" font-size="15">waiting for recruiter input</text>
    <rect x="989" y="369" width="9" height="17" rx="1" fill="#b8ffd9" class="cursor"/>
  </g>
</g>

<!-- A handwritten-style annotation and a floating paper note. -->
<path d="M527 293C619 249 640 172 689 182" fill="none" stroke="#c6a6f4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7"/>
<path d="M674 172L690 182L674 190" fill="none" stroke="#c6a6f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(842 424) rotate(-6)">
  <g class="note">
    <rect x="6" y="8" width="270" height="84" rx="3" fill="#0f0c18" opacity=".35"/>
    <path d="M0 0H270V67L253 84H0Z" fill="#f4d994"/>
    <path d="M253 84V67H270" fill="#d9b964"/>
    <rect x="89" y="-9" width="90" height="20" fill="#fdf2da" fill-opacity=".37" transform="rotate(3 134 1)"/>
    <text x="20" y="33" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#715327">PLOT TWIST:</text>
    <text x="20" y="63" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.5" fill="#312238">you're hiring?</text>
  </g>
</g>

<path d="M52 489H736" stroke="#8d759e" stroke-opacity=".35"/>
<g font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.1" fill="#b6a6c8">
  <text x="52" y="526">CURRENT QUEST: FIND MY PEOPLE</text>
  <text x="735" y="526" text-anchor="end" fill="#b8ffd9">ACTIVELY JOB HUNTING ↗</text>
</g>
</svg>